{% extends "base.html" %}
{% block title %}Set New Password — MediCore{% endblock %}
{% block public_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <a href="{{ url_for('public.landing') }}">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="MediCore" height="34">
      </a>
    </div>

    <h1>Set New Password</h1>
    <p class="auth-subtext">Choose a new, secure password for your account</p>

    <form method="post">
      {% include "_csrf.html" %}
      <div class="mb-4">
        <label class="form-label">New Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
          <input class="form-control" type="password" name="password" minlength="8" required placeholder="Minimum 8 characters">
        </div>
        <div class="form-text">All active sessions will be invalidated upon reset.</div>
      </div>

      <button class="btn-primary-brand w-100 py-2 mb-3" type="submit">
        <i class="bi bi-check-lg"></i> Update Password &amp; Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
