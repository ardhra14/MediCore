{% extends "base.html" %}
{% block title %}Sign in — MediCore Healthcare Systems{% endblock %}
{% block public_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <a href="{{ url_for('public.landing') }}">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="MediCore" height="34">
      </a>
    </div>

    <h1>Welcome Back</h1>
    <p class="auth-subtext">Access your MediCore clinical and administration portal</p>

    <form method="post" id="loginForm" autocomplete="off">
      {% include "_csrf.html" %}
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
          <input class="form-control" type="email" name="email" id="emailInput" required autocomplete="off" value="">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label mb-0">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" class="small text-teal">Forgot password?</a>
        </div>
        <div class="input-group mt-1">
          <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
          <input class="form-control" type="password" name="password" id="passwordInput" required autocomplete="current-password" value="">
        </div>
      </div>

      <button class="btn-primary-brand w-100 py-2 mb-3" type="submit">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to Portal
      </button>
    </form>

    <div class="d-flex justify-content-between align-items-center text-muted small pt-2 border-top">
      <span>Need an account?</span>
      <a href="{{ url_for('auth.register') }}" class="fw-medium text-teal">Register as Patient</a>
    </div>
  </div>
</div>
{% endblock %}
