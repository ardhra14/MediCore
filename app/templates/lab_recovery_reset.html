{% extends "base.html" %}
{% block title %}Vulnerable Reset — MediCore{% endblock %}
{% block public_content %}
<div class="public-wrapper">
  <div class="card-surface mx-auto" style="max-width: 640px;">
    <div class="card-header-flex">
      <h6 class="card-header-title mb-0"><i class="bi bi-shield-exclamation text-danger"></i> Vulnerable Reset Form</h6>
      <span class="badge bg-danger-subtle text-danger border border-danger-subtle">Lab Token</span>
    </div>
    <div class="p-4">
      {% include "_flash.html" %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input class="form-control" type="password" name="password" minlength="8" required>
        </div>
        <button class="btn btn-danger btn-sm" type="submit"><i class="bi bi-shield-lock"></i> Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
