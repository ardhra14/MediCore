{% extends "base.html" %}
{% block title %}New Invoice — MediCore{% endblock %}
{% block page_title %}Create Invoice{% endblock %}
{% block content %}
<div class="card-surface">
  <div class="card-header-flex"><h6 class="card-header-title mb-0"><i class="bi bi-receipt text-teal"></i> Invoice Details</h6></div>
  <form method="post" action="{{ url_for('billing.new_invoice') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3 p-3">
      <div class="col-md-6">
        <label class="form-label">Patient</label>
        <select class="form-select" name="patient_id" required>
          <option value="">Select patient</option>
          {% for patient in patients %}
            <option value="{{ patient.id }}">{{ patient.full_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Amount</label>
        <input class="form-control" name="amount" type="number" step="0.01" min="0" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          <option value="unpaid">Unpaid</option>
          <option value="paid">Paid</option>
          <option value="overdue">Overdue</option>
        </select>
      </div>
      <div class="col-12 d-flex justify-content-end gap-2">
        <a href="{{ url_for('billing.list_invoices') }}" class="btn btn-secondary-brand btn-sm">Cancel</a>
        <button class="btn btn-primary-brand btn-sm" type="submit"><i class="bi bi-check-lg"></i> Save Invoice</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
