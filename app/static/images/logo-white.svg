<svg width="180" height="42" viewBox="0 0 180 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MediCore Geometric Mark: Clean White & Green for Dark Surfaces -->
  <g id="logo-mark" transform="translate(3, 3)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.2"/>
    <!-- Medical Cross Stem (White) -->
    <path d="M18 10V26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 18H26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Vitality Pulse Arc (Vibrant Green) -->
    <path d="M11 23C9 20 9 14 14 11C18 9 24 10 26 15" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Central Vital Dot (Green) -->
    <circle cx="18" cy="18" r="2.5" fill="#22C55E"/>
  </g>

  <!-- Typography: White & Green MediCore -->
  <g id="logo-type" transform="translate(48, 25)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="21" font-weight="800" letter-spacing="-0.5px">
      <tspan fill="#FFFFFF">Medi</tspan><tspan fill="#22C55E">Core</tspan>
    </text>
    <text x="0" y="10" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="8" font-weight="600" fill="#A1A1AA" letter-spacing="1.5px">CLINIC &amp; HEALTHCARE</text>
  </g>
</svg>